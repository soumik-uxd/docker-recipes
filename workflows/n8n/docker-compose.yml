x-n8n: &service-n8n
  image: n8nio/n8n:${N8N_VERSION-stable}
  environment:
    - DB_TYPE=postgresdb
    - DB_POSTGRESDB_HOST=n8n-postgres
    - DB_POSTGRESDB_USER=${POSTGRES_USER}
    - DB_POSTGRESDB_PASSWORD=${POSTGRES_PASSWORD}
    - N8N_DIAGNOSTICS_ENABLED=false
    - N8N_PERSONALIZATION_ENABLED=false
    - N8N_USER_MANAGEMENT_DISABLED=true
    - N8N_COMMUNITY_PACKAGES_ENABLED=true
    - N8N_COMMUNITY_PACKAGES=@n8n/n8n-nodes-langchain
    - N8N_ENCRYPTION_KEY
    - N8N_USER_MANAGEMENT_JWT_SECRET
    - EXECUTIONS_MODE=queue
    - QUEUE_BULL_REDIS_HOST=n8n-redis
    - QUEUE_BULL_REDIS_PORT=6379
    - QUEUE_HEALTH_CHECK_ACTIVE=true
    - N8N_ENFORCE_SETTINGS_FILE_PERMISSIONS=true
    - N8N_RUNNERS_ENABLED=true
    - OFFLOAD_MANUAL_EXECUTIONS_TO_WORKERS=true
  env_file:
    - .env
  volumes:
    - n8n_storage:/home/node/.n8n
    - ./flows:/home/node/workflows
    - ./credentials:/home/node/credentials
  depends_on:
    n8n-redis:
      condition: service_healthy
    n8n-postgres:
      condition: service_healthy
  networks:
    - n8n-net

services:
  n8n-postgres:
    image: postgres:${POSTGRES_VERSION-16-alpine}
    container_name: n8n-postgres
    hostname: n8n-postgres
    restart: unless-stopped
    env_file:
      - .env
    environment:
      - POSTGRES_USER
      - POSTGRES_PASSWORD
      - POSTGRES_DB
    ports:
      - "5432:5432"
    volumes:
      - n8n-db-storage:/var/lib/postgresql/data
    extra_hosts:
      - "host.docker.internal:host-gateway"
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -h localhost -U ${POSTGRES_USER} -d ${POSTGRES_DB}']
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - n8n-net

  n8n-redis:
    image: redis:${REDIS_VERSION-8-alpine}
    hostname: n8n-redis
    container_name: n8n-redis
    restart: always
    volumes:
      - n8n-redis_storage:/data
    ports:
      - 6379:6379
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - n8n-net

  n8n-setup:
    <<: *service-n8n
    hostname: n8n-setup
    container_name: n8n-setup
    entrypoint: /bin/sh
    command:
      - "-c"
      - "n8n import:credentials --input=/home/node/credentials/credentials.json && n8n import:workflow --separate --input=/home/node/workflows"
    networks:
      - n8n-net
    depends_on:
      n8n-postgres:
        condition: service_healthy
  
  n8n:
    <<: *service-n8n
    hostname: n8n
    container_name: n8n
    restart: unless-stopped
    ports:
      - 5678:5678
    depends_on:
      n8n-postgres:
        condition: service_healthy
      n8n-setup:
        condition: service_completed_successfully

  n8n-worker:
    <<: *service-n8n
    command: worker
    depends_on:
      n8n:
        condition: service_started
      n8n-postgres:
        condition: service_healthy
      n8n-setup:
        condition: service_completed_successfully

  pgadmin:
    container_name: pgadmin
    image: dpage/pgadmin4:${PGADMIN_VERSION-9.1}
    restart: always
    environment:
      PGADMIN_DEFAULT_EMAIL: ${PGADMIN_EMAIL-admin@admin.com}
      PGADMIN_DEFAULT_PASSWORD: ${PGADMIN_PASSWORD-root}
      PGADMIN_CONFIG_MASTER_PASSWORD_REQUIRED: "False"
    ports:
      - "5050:80"
    networks:
      - n8n-net
    volumes:
      - pgadmin-data:/var/lib/pgadmin
      - ./scripts/db_conf/servers.json:/pgadmin4/servers.json # preconfigured servers/connections
      - ./scripts/db_conf/pgpass:/pgadmin4/pgpass # passwords for the connections in this file
    extra_hosts:
      - "host.docker.internal:host-gateway"
    entrypoint: >
      /bin/sh -c '
      storage_user="$$(printf "%s" "$$PGADMIN_DEFAULT_EMAIL" | sed "s/@/_/g")";
      storage_dir="/var/lib/pgadmin/storage/$$storage_user";
      mkdir -p "$$storage_dir";
      cp -f /pgadmin4/pgpass "$$storage_dir/pgpass";
      chmod 600 "$$storage_dir/pgpass";
      chown -R pgadmin:root "$$storage_dir";
      if [ -f /var/lib/pgadmin/pgadmin4.db ]; then
        /venv/bin/python /pgadmin4/setup.py load-servers /pgadmin4/servers.json --user "$$PGADMIN_DEFAULT_EMAIL" --replace;
      fi;
      exec /entrypoint.sh
      '
    healthcheck:
      test: ["CMD", "wget", "-O", "-", "http://localhost:80/misc/ping"]
      interval: 10s
      timeout: 10s
      start_period: 160s
      retries: 3
    depends_on:
      n8n-postgres:
        condition: service_healthy

volumes:
  n8n-db-storage:
    name: n8n-db-storage
  n8n_storage:
    name: n8n-storage
  n8n-redis_storage:
    name: n8n-redis-storage
  pgadmin-data:
    name: n8n-pgadmin-data
  
networks:
  n8n-net:
    name: n8n-net
    driver: bridge
