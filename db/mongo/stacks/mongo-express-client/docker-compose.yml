services:
  mongo-server:
    image: mongo:${MONGODB_VERSION:-8.3.11-noble}
    container_name: mongoserver
    ports:
      - 27017:27017
      - 27018:27018
    environment:
      - MONGO_INITDB_DATABASE=test
      - MONGO_INITDB_ROOT_USERNAME=admin
      - MONGO_INITDB_ROOT_PASSWORD=admin
    healthcheck:
      test: ["CMD", "/bin/bash", "-c", "mongosh --quiet --eval 'quit(db.runCommand({ ping: 1 }).ok ? 0 : 1)'"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 40s
    volumes:
      - mongo-data:/data/db
      - ./initdb:/docker-entrypoint-initdb.d # Init script
    networks:
      - mongo_net

  mongo-client:
    image: mongo-express:latest
    container_name: mongo-client
    environment:
      ME_CONFIG_MONGODB_ADMINUSERNAME: admin
      ME_CONFIG_MONGODB_ADMINPASSWORD: admin
      ME_CONFIG_MONGODB_SERVER: mongoserver
      ME_CONFIG_MONGODB_PORT: "27017"
    ports:
      - 8081:8081
    networks:
      - mongo_net
    depends_on:
      mongo-server:
        condition: service_healthy
    command: ["/wait-for-it.sh", "mongoserver:27017", "--", "tini", "--", "/docker-entrypoint.sh"]
    volumes:
      - ./wait-for-it.sh:/wait-for-it.sh

networks:
  mongo_net:
    name: mongo_net
    driver: bridge

volumes:
  mongo-data:
